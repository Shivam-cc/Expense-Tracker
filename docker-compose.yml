# Local-only stack. MongoDB is unauthenticated and bound to loopback; use Atlas or a secured replica set in production.
# Start just the database: docker compose up -d mongodb
# Start the API too: docker compose up --build -d
name: expenseflow

services:
  mongodb:
    # 8.2, not 8.0: GitHub-hosted runners are on Linux 6.19+, and MongoDB 8.0
    # refuses to start there (SERVER-121912). The 8.2 line still starts.
    image: mongo:8.2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (db.hello().isWritablePrimary) { quit(0); } if (!db.hello().setName) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); } quit(1); } catch (e) { print(e); quit(1); }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: "8080"
      MONGODB_URI: mongodb://mongodb:27017/expense_tracker?replicaSet=rs0&directConnection=true
      JWT_SECRET: ${JWT_SECRET:-ZXhwZW5zZWZsb3ctbG9jYWwtY29tcG9zZS1qd3Qtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi11c2U=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-noreply@example.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-ExpenseFlow}
      SENTRY_DSN: ${SENTRY_DSN:-}

volumes:
  mongodata:

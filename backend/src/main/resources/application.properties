# Application
spring.application.name=expense-tracker-api
server.port=${PORT:8080}

# Active profile: 'local' for dev (H2), 'prod' for deployment (PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT - JWT_SECRET (base64, >= 256 bits) is mandatory; the app refuses to start without it.
# A dev-only value lives in application-local.properties.
app.jwt.secret=${JWT_SECRET:}
# Access token lifetime (15 min). Refresh tokens last 30 days and are stored hashed in the DB.
app.jwt.access-expiration-ms=900000

# CORS - comma-separated list of allowed origins. Dev default is the Vite server only;
# application-prod.properties requires CORS_ORIGINS to be set explicitly.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# OTP - dev mode (OTP returned in API response) can only be enabled from application-local.properties
app.otp.dev-mode=false

# Number of trusted reverse proxies in front of the app (Railway edge = 1).
# The client IP is taken from X-Forwarded-For counting this many entries from the right.
# 0 = ignore X-Forwarded-For and use the socket address.
app.proxy.trusted-hops=${TRUSTED_PROXY_HOPS:1}

# Rate limiting (requests per minute per client IP)
app.rate-limit.auth-max=15
app.rate-limit.general-max=300

# Email (SendGrid Web API v3 - https://sendgrid.com)
# Set SENDGRID_API_KEY and SENDGRID_FROM in Railway env vars.
app.sendgrid.api-key=${SENDGRID_API_KEY:}
app.sendgrid.from=${SENDGRID_FROM:noreply@expenseflow.com}
app.sendgrid.from-name=${SENDGRID_FROM_NAME:ExpenseFlow}

# JPA common. The schema is owned by Flyway (db/migration); Hibernate only validates it.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway. Databases created before Flyway existed (Hibernate ddl-auto=update) have tables but no history:
# baseline them at V1 (= V1__baseline.sql, already applied) and run V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# API docs (Swagger UI /swagger-ui.html, OpenAPI /v3/api-docs). Off unless a profile turns them on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Observability
# Only health and info are exposed, and only these two are permitted without auth (see SecurityConfig).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Every log line carries the request ID set by RequestIdFilter.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n

# Sentry error tracking is a no-op unless SENTRY_DSN is set.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
sentry.send-default-pii=false
sentry.traces-sample-rate=0.0
# Run after GlobalExceptionHandler so handled 4xx business errors are not reported.
sentry.exception-resolver-order=2147483647

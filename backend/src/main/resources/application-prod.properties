# PRODUCTION profile (MongoDB Atlas or an authenticated replica set)
spring.data.mongodb.uri=${MONGODB_URI}

# Swagger UI / OpenAPI are off in production unless API_DOCS_ENABLED=true
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Required: comma-separated list of allowed frontend origins, e.g. https://expenseflow.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS}

# Structured JSON logs (ECS) so Railway's log search can filter on fields such as requestId.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=expense-tracker-api
logging.structured.ecs.service.environment=prod

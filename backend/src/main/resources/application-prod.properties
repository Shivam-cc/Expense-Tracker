# ── PRODUCTION profile (PostgreSQL) ─────────────────────────────────────────
# Railway injects DATABASE_URL automatically; we remap it to Spring Boot vars.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.otp.dev-mode=${OTP_DEV_MODE:false}

# Structured JSON logs (ECS) so Railway's log search can filter on fields such as requestId.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=expense-tracker-api
logging.structured.ecs.service.environment=prod

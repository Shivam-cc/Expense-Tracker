# LOCAL DEV profile (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:expense_tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dev-only JWT secret (public in git - never valid in production). Override with JWT_SECRET if desired.
app.jwt.secret=${JWT_SECRET:ZXhwZW5zZWZsb3ctbG9jYWwtZGV2LW9ubHktand0LXNlY3JldC1uZXZlci11c2UtaW4tcHJvZC03ZjNhOTE=}

# Local dev: return OTP in API response (no email server available)
app.otp.dev-mode=true

# No reverse proxy in front of a local run
app.proxy.trusted-hops=0

# LOCAL DEV profile (persistent MongoDB; start with docker compose up -d mongodb)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/expense_tracker?replicaSet=rs0&directConnection=true}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Dev-only JWT secret (public in git - never valid in production). Override with JWT_SECRET if desired.
app.jwt.secret=${JWT_SECRET:ZXhwZW5zZWZsb3ctbG9jYWwtZGV2LW9ubHktand0LXNlY3JldC1uZXZlci11c2UtaW4tcHJvZC03ZjNhOTE=}

# Local dev: return OTP in API response (no email server available)
app.otp.dev-mode=true

# No reverse proxy in front of a local run
app.proxy.trusted-hops=0

# The mobile E2E suite makes many auth calls from one IP per run; the production limit (15/min) would throttle it.
app.rate-limit.auth-max=1000

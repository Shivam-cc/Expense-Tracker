name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs (Actions tab > CI > Run workflow). GitHub has no per-job trigger,
  # so this runs every job.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start test database
        run: docker compose -f ../docker-compose.yml up -d --wait mongodb

      - name: Build, test and generate coverage
        run: ./mvnw -B verify

      - name: Dump MongoDB logs on failure
        if: failure()
        run: docker compose -f ../docker-compose.yml logs mongodb

      - name: Stop test database
        if: always()
        run: docker compose -f ../docker-compose.yml down

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  mobile-android:
    name: Mobile Android (Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set), so no separate
      # SDK install step is needed. android-actions/setup-android@v3 was failing every run.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and debug APK
        run: ./gradlew --no-daemon :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:build :androidApp:assembleDebug
      - name: Upload Android reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-results
          path: |
            mobile/androidApp/build/outputs/apk/debug/*.apk
            mobile/androidApp/build/reports
            mobile/shared/build/reports/tests/jvmTest

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Advisory for now: the report is useful but shouldn't block merges on a transitive dependency.
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

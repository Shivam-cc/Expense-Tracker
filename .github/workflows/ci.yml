name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs (Actions tab > CI > Run workflow). GitHub has no per-job trigger,
  # so this runs every job, including mobile-ios.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and generate coverage
        run: |
          docker compose -f ../docker-compose.yml up -d --wait mongodb
          ./mvnw -B verify

      - name: Stop test database
        if: always()
        run: docker compose -f ../docker-compose.yml down

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  mobile-android:
    name: Mobile Android (Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and debug APK
        run: ./gradlew --no-daemon :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:build :androidApp:assembleDebug
      - name: Upload Android reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-results
          path: |
            mobile/androidApp/build/outputs/apk/debug/*.apk
            mobile/androidApp/build/reports
            mobile/shared/build/reports/tests/jvmTest

  mobile-ios:
    name: Mobile iOS (KMP, macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: mobile/gradle/libs.versions.toml

      # Compiles the iOS framework targets and runs commonTest on an arm64 simulator.
      - name: Compile iOS targets
        run: ./gradlew --no-daemon :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64 :shared:compileKotlinIosX64

      - name: iOS simulator tests
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test

      - name: Upload iOS test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: mobile/shared/build/test-results
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Advisory for now: the report is useful but shouldn't block merges on a transitive dependency.
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

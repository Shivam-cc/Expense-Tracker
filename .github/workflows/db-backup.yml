name: Database backup

# Weekly encrypted MongoDB archive, kept as a GitHub Actions artifact.
# Requires repository secrets MONGODB_URI and BACKUP_PASSPHRASE; without them the job exits cleanly.
# See docs/operations/backup-restore.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::MONGODB_URI and/or BACKUP_PASSPHRASE secrets are not configured. Skipping backup."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump and encrypt
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="expenseflow-${stamp}.archive.gz"
          docker run --rm --env MONGODB_URI --env BACKUP_ARCHIVE="$dump" \
            --mount "type=bind,source=$PWD,target=/backup" mongo:8.0 \
            sh -c 'mongodump --uri="$MONGODB_URI" --gzip --archive="/backup/$BACKUP_ARCHIVE"'
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "${dump}.gpg" "$dump"
          rm -f "$dump"
          ls -lh "${dump}.gpg"

      - name: Upload encrypted backup
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: expenseflow-*.archive.gz.gpg
          retention-days: 30
          if-no-files-found: error

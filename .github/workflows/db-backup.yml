name: Database backup

# Weekly encrypted pg_dump of the production database, kept as a GitHub Actions artifact.
# Requires repository secrets DATABASE_URL and BACKUP_PASSPHRASE; without them the job exits cleanly.
# See docs/operations/backup-restore.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Must be at least the major version of the server (check Railway -> Postgres -> Variables / Settings).
      PG_CLIENT_VERSION: "17"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::DATABASE_URL and/or BACKUP_PASSPHRASE secrets are not configured. Skipping backup."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        if: steps.check.outputs.enabled == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-${PG_CLIENT_VERSION}"

      - name: Dump and encrypt
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="expenseflow-${stamp}.dump"
          "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_dump" \
            --format=custom --no-owner --no-privileges --file "$dump" "$DATABASE_URL"
          "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_restore" --list "$dump" > /dev/null
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "${dump}.gpg" "$dump"
          rm -f "$dump"
          ls -lh "${dump}.gpg"

      - name: Upload encrypted backup
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: db-backup
          path: expenseflow-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
